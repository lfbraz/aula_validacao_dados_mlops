# This GitHub workflow deploys Bundle resources (ML resource config and more)
# defined under validacao_dados_aula_8/resources/*
# and validacao_dados_aula_8/databricks.yml with staging deployment target configs,
# when PRs are merged into the default branch
name: Bundle Deployment for validacao_dados_aula_8 Staging

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./validacao_dados_aula_8

env:
  DATABRICKS_TOKEN: ${{ secrets.STAGING_WORKSPACE_TOKEN }}
  BUNDLE_VAR_workspace_host: ${{ secrets.BUNDLE_VAR_WORKSPACE_HOST }}

jobs:
  staging:
    concurrency: validacao_dados_aula_8-staging-bundle-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v0.236.0
      - name: Validate Bundle For Staging
        id: validate
        run: |
          databricks bundle validate -t staging
      - name: Deploy Bundle to Staging
        id: deploy
        run: |
          databricks bundle deploy -t staging
