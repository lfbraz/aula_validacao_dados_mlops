common_permissions: &permissions
  permissions:
    - level: CAN_VIEW
      group_name: users

resources:
  jobs:
    batch_inference_job:
      name: ${bundle.target}-validacao_dados_aula_8-batch-inference-job
      environments:
        - environment_key: default
      tasks:
        - task_key: batch_inference_job
          environment_key: default
          notebook_task:
            notebook_path: ../deployment/batch_inference/notebooks/BatchInference.py
            base_parameters:
              env: ${bundle.target}
              # Tabela de scoring criada pelo notebook DataSetup.py (sem a coluna target)
              input_table_name: ${var.catalog_name}.validacao_dados_aula_8.taxi_scoring
              output_table_name: ${var.catalog_name}.validacao_dados_aula_8.predictions
              model_name: ${var.catalog_name}.validacao_dados_aula_8.${var.model_name}
              # git source information of current ML resource deployment. It will be persisted as part of the workflow run
              git_source_info: url:${bundle.git.origin_url}; branch:${bundle.git.branch}; commit:${bundle.git.commit}

      schedule:
        quartz_cron_expression: "0 0 11 * * ?" # daily at 11am
        timezone_id: UTC
      <<: *permissions
      # If you want to turn on notifications for this job, please uncomment the below code,
      # and provide a list of emails to the on_failure argument.
      #
      #  email_notifications:
      #    on_failure:
      #      - first@company.com
      #      - second@company.com
